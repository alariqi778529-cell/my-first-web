<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دفع مشتريات وخدمات</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f5f9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      color: #333;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      background-color: #f4f5f9;
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .app-header {
      background-color: #e65100;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icons i {
      font-size: 1.2rem;
      cursor: pointer;
      margin-left: 10px;
    }

    /* Form Body */
    .app-body {
      padding: 16px;
      flex-grow: 1;
    }

    .field-group {
      margin-bottom: 20px;
    }

    .field-label {
      font-weight: bold;
      color: #1a237e;
      margin-bottom: 8px;
      display: block;
      font-size: 0.95rem;
      text-align: center;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #c5cae9;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .input-box i.user-icon {
      color: #1a237e;
      font-size: 1.2rem;
      margin-left: 10px;
    }

    .input-box input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 1rem;
      color: #333;
      direction: ltr;
      text-align: right;
    }

    .qr-icon {
      position: absolute;
      right: -35px;
      color: #e65100;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .fav-link {
      display: flex;
      align-items: center;
      color: #1a237e;
      font-size: 0.85rem;
      margin-top: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .fav-link i {
      color: #fbc02d;
      margin-left: 5px;
    }

    .currency-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .currency-select {
      background: white;
      border: 1px solid #c5cae9;
      border-radius: 8px;
      padding: 10px;
      font-weight: bold;
      color: #1a237e;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .balance-info {
      color: #1a237e;
      font-size: 0.85rem;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: bold;
    }

    .balance-info i {
      color: #e65100;
    }

    .words-converted {
      color: #1a237e;
      font-size: 0.85rem;
      margin-top: 4px;
      font-weight: bold;
    }

    .textarea-box {
      background: white;
      border: 1px solid #c5cae9;
      border-radius: 8px;
      padding: 10px;
      position: relative;
    }

    .textarea-box textarea {
      width: 100%;
      height: 60px;
      border: none;
      outline: none;
      resize: none;
      font-size: 0.9rem;
    }

    .char-count {
      position: absolute;
      bottom: 5px;
      left: 10px;
      font-size: 0.75rem;
      color: #777;
    }

    .btn-submit {
      width: 100%;
      background-color: #5c6bc0;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    /* Modal / Overlay */
    .overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: 10;
      justify-content: center;
      align-items: center;
    }

    .loading-modal {
      background: #e65100;
      color: white;
      padding: 20px 30px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Confirmation Screen */
    .confirm-screen {
      display: none;
      flex-direction: column;
      padding: 16px;
    }

    .summary-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 15px;
    }

    .pay-title {
      color: #1a237e;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    .pay-amount {
      color: #e65100;
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .store-icon {
      width: 50px;
      height: 50px;
      margin: 0 auto 10px auto;
      background: #fff3e0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e65100;
      font-size: 1.5rem;
    }

    .store-name {
      color: #1a237e;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .store-id {
      color: #666;
      font-size: 0.85rem;
    }

    .details-card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .details-title {
      color: #1a237e;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .detail-label {
      color: #666;
    }

    .detail-value {
      color: #1a237e;
      font-weight: bold;
    }

    .btn-confirm {
      background-color: #1a237e;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn-cancel {
      background-color: transparent;
      color: #1a237e;
      border: none;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <div class="app-header">
    <div class="header-title">
      <i class="fa-solid fa-arrow-right" onclick="resetForm()"></i>
      <span>دفع مشتريات وخدمات</span>
    </div>
    <div class="header-icons">
      <i class="fa-regular fa-circle-question"></i>
      <i class="fa-regular fa-bell"></i>
    </div>
  </div>

  <!-- Main Payment Form -->
  <div class="app-body" id="paymentForm">
    <!-- Step 1: Account Number -->
    <div class="field-group">
      <label class="field-label">أدخل رقم نقطة الدفع</label>
      <div style="position: relative;">
        <div class="input-box">
          <i class="fa-solid fa-user user-icon"></i>
          <input type="text" id="pointId" value="204896">
        </div>
        <i class="fa-solid fa-qrcode qr-icon"></i>
      </div>
      <div class="fav-link">
        <i class="fa-solid fa-star"></i> اختر من المفضلة
      </div>
    </div>

    <!-- Step 2: Amount -->
    <div class="field-group">
      <label class="field-label">مبلغ العملية</label>
      <div class="currency-row">
        <div class="currency-select">
          <span>ري</span> <i class="fa-solid fa-chevron-down"></i>
        </div>
        <div class="input-box" style="flex-grow: 1;">
          <input type="text" id="amountInput" value="1,000" oninput="updateWords()">
        </div>
      </div>
      <div class="words-converted" id="amountInWords">ألف ر.ي</div>
      <div class="balance-info">
        <i class="fa-solid fa-coins"></i> رصيدي ****** ر.ي
      </div>
    </div>

    <!-- Step 3: Note -->
    <div class="field-group">
      <label class="field-label">ملاحظة (اختياري)</label>
      <div class="textarea-box">
        <textarea id="noteInput" placeholder="أضف ملاحظة هنا..."></textarea>
        <span class="char-count">0/30</span>
      </div>
    </div>

    <button class="btn-submit" onclick="submitPayment()">التالي</button>
  </div>

  <!-- Confirmation Screen -->
  <div class="confirm-screen" id="confirmScreen">
    <div class="summary-card">
      <div class="pay-title">ستقوم بدفع</div>
      <div class="pay-amount" id="displayAmount">1,000.00 ر.ي</div>
      <div class="store-icon">
        <i class="fa-solid fa-store"></i>
      </div>
      <div class="pay-title">الى</div>
      <div class="store-name">محطة كيلو 9</div>
      <div class="store-id" id="displayPointId">204896</div>
    </div>

    <div class="details-card">
      <div class="details-title">تفاصيل العملية</div>
      <div class="detail-row">
        <span class="detail-label">المبلغ</span>
        <span class="detail-value" id="detailAmount">1,000.00 ر.ي</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">الرسوم</span>
        <span class="detail-value">0.00 ر.ي</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">الإجمالي</span>
        <span class="detail-value" id="detailTotal">1,000.00 ر.ي</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">الإجمالي كتابة</span>
        <span class="detail-value" id="detailWords">ألف ر.ي</span>
      </div>
    </div>

    <button class="btn-confirm" onclick="alert('تمت العملية بنجاح!')">تأكيد</button>
    <button class="btn-cancel" onclick="resetForm()">إلغاء</button>
  </div>

  <!-- Loading Overlay -->
  <div class="overlay" id="loadingOverlay">
    <div class="loading-modal">
      <div class="spinner"></div>
      <div>يرجى الانتظار...</div>
    </div>
  </div>
</div>

<script>
  function updateWords() {
    const val = document.getElementById('amountInput').value.replace(/,/g, '');
    const wordsDiv = document.getElementById('amountInWords');
    if (val === "1000" || val === "1000.00") {
      wordsDiv.textContent = "ألف ر.ي";
    } else if (val === "100") {
      wordsDiv.textContent = "مئة ر.ي";
    } else if (val === "10") {
      wordsDiv.textContent = "عشرة ر.ي";
    } else if (val === "1") {
      wordsDiv.textContent = "واحد ر.ي";
    } else {
      wordsDiv.textContent = val ? val + " ر.ي" : "";
    }
  }

  function submitPayment() {
    const overlay = document.getElementById('loadingOverlay');
    overlay.style.display = 'flex';

    setTimeout(() => {
      overlay.style.display = 'none';
      document.getElementById('paymentForm').style.display = 'none';
      
      const amt = document.getElementById('amountInput').value || "1,000";
      const ptId = document.getElementById('pointId').value || "204896";
      const words = document.getElementById('amountInWords').textContent;

      document.getElementById('displayAmount').textContent = amt + ".00 ر.ي";
      document.getElementById('displayPointId').textContent = ptId;
      document.getElementById('detailAmount').textContent = amt + ".00 ر.ي";
      document.getElementById('detailTotal').textContent = amt + ".00 ر.ي";
      document.getElementById('detailWords').textContent = words;

      document.getElementById('confirmScreen').style.display = 'flex';
    }, 1500);
  }

  function resetForm() {
    document.getElementById('confirmScreen').style.display = 'none';
    document.getElementById('paymentForm').style.display = 'block';
  }
</script>

</body>
</html>
