<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>دفع مشتريات وخدمات</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#f7f7f7;
    font-family:Tahoma, Arial, sans-serif;
    color:#263e82;
}

/* =========================
   التطبيق
========================= */

.app{
    width:100%;
    min-height:100vh;
    background:#f8f8f8;
    overflow:hidden;
    position:relative;
}

/* =========================
   HEADER
========================= */

.header{
    width:100%;
    height:161px;
    background:#f86b1b;
    position:relative;
    color:white;
}

/* أيقونات أعلى الشاشة */

.status{
    position:absolute;
    top:27px;
    left:45px;
    right:43px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    color:white;
    font-size:14px;
    direction:ltr;
    opacity:.95;
}

.status-left{
    display:flex;
    align-items:center;
    gap:8px;
}

.status-right{
    display:flex;
    align-items:center;
    gap:8px;
}

/* محتوى الهيدر */

.header-content{
    position:absolute;

    left:24px;
    right:24px;
    bottom:20px;

    height:65px;

    display:flex;
    align-items:center;
}

/* زر الاستفهام */

.help{
    width:38px;
    height:38px;

    background:#fff;
    color:#f86b1b;

    border-radius:50%;
    border:none;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;
    font-weight:bold;

    position:absolute;
    left:0;

    cursor:pointer;
}

/* السهم */

.back{
    position:absolute;
    right:0;

    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
}

.back::before{
    content:"";
    width:29px;
    height:29px;

    border-top:3px solid white;
    border-right:3px solid white;

    transform:rotate(45deg);
}

/* صورة المستخدم */

.avatar{
    position:absolute;

    left:67px;

    width:53px;
    height:53px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid rgba(255,255,255,.35);

    background:#ddd;
}

/* عنوان الهيدر */

.header-title{
    position:absolute;

    left:150px;
    right:70px;

    text-align:center;

    font-size:27px;
    font-weight:700;

    white-space:nowrap;
}

/* =========================
   المحتوى
========================= */

.content{
    width:100%;

    padding-top:47px;
    padding-left:44px;
    padding-right:44px;

    position:relative;
}

/* =========================
   العناوين
========================= */

.label{
    color:#263e82;

    font-size:29px;
    font-weight:700;

    text-align:right;

    line-height:1.4;

    margin-bottom:26px;
}

/* =========================
   رقم نقطة الدفع
========================= */

.payment-area{
    width:100%;

    position:relative;

    margin-bottom:31px;
}

.payment-row{
    width:100%;

    display:flex;
    direction:ltr;

    align-items:center;

    gap:14px;
}

/* QR */

.qr{
    width:88px;
    height:94px;

    flex-shrink:0;

    background:#fff;

    border:2px solid #d9dde5;

    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ef6b2a;

    cursor:pointer;
}

.qr svg{
    width:39px;
    height:39px;
}

/* حقل نقطة الدفع */

.payment-box{
    height:94px;

    flex:1;

    background:#fff;

    border:2px solid #e77a35;

    border-radius:15px;

    display:flex;
    align-items:center;

    padding:0 17px;

    direction:ltr;
}

/* المستخدم */

.user-icon{
    width:48px;
    height:48px;

    flex-shrink:0;

    color:#263e82;

    display:flex;
    align-items:center;
    justify-content:center;
}

.user-icon svg{
    width:47px;
    height:47px;
}

/* input */

.payment-input{
    flex:1;

    height:100%;

    border:none;
    outline:none;

    background:transparent;

    font-size:25px;

    color:#263e82;

    text-align:right;

    padding-right:8px;
}

.payment-input:focus{
    border:none;
    outline:none;
}

/* المؤشر البرتقالي */

.payment-input:focus{
    caret-color:#e77a35;
}

/* =========================
   المفضلة
========================= */

.favorite{
    margin-top:29px;

    display:flex;

    align-items:center;

    justify-content:flex-start;

    gap:8px;

    color:#263e82;

    font-size:24px;

    font-weight:bold;

    text-decoration:underline;

    cursor:pointer;
}

.star{
    color:#ffbf00;

    font-size:36px;

    line-height:1;

    text-decoration:none;
}

/* =========================
   مبلغ العملية
========================= */

.amount-section{
    margin-top:52px;
}

.amount-section .label{
    margin-bottom:36px;
}

/* صف المبلغ */

.amount-row{
    display:flex;

    direction:ltr;

    gap:14px;

    width:100%;
}

/* العملة */

.currency{
    width:164px;
    height:106px;

    background:#fff;

    border:2px solid #d9dde5;

    border-radius:15px;

    color:#263e82;

    font-family:Tahoma,Arial,sans-serif;

    font-size:23px;
    font-weight:bold;

    text-align:center;

    outline:none;

    appearance:auto;

    direction:rtl;

    cursor:pointer;
}

/* المبلغ */

.amount-input{
    flex:1;

    height:106px;

    background:#fff;

    border:2px solid #d9dde5;

    border-radius:15px;

    outline:none;

    color:#263e82;

    font-family:Tahoma,Arial,sans-serif;

    font-size:27px;

    padding:0 22px;

    text-align:right;
}

.amount-input::placeholder{
    color:#8995b8;
    opacity:1;
}

.amount-input:focus{
    border-color:#d9dde5;
}

/* =========================
   الرصيد
========================= */

.balance{
    margin-top:34px;

    display:flex;

    align-items:center;

    justify-content:flex-start;

    gap:5px;

    color:#263e82;

    font-size:23px;

    font-weight:bold;
}

.balance-text{
    direction:rtl;
}

.eye{
    width:42px;
    height:42px;

    border-radius:50%;

    border:2px solid #263e82;

    background:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    margin-right:2px;

    position:relative;
}

.eye::before{
    content:"";

    width:27px;
    height:20px;

    border:4px solid #263e82;

    border-radius:50%;

    position:absolute;
}

.eye::after{
    content:"";

    width:8px;
    height:8px;

    background:#f86b1b;

    border-radius:50%;

    position:absolute;
}

/* =========================
   الملاحظة
========================= */

.note-section{
    margin-top:43px;
}

.note-label{
    color:#263e82;

    font-size:24px;

    font-weight:bold;

    text-align:right;

    margin-bottom:33px;
}

.note-box{
    width:100%;

    height:122px;

    resize:none;

    background:#fff;

    border:2px solid #d9dde5;

    border-radius:15px;

    outline:none;

    padding:25px 20px;

    color:#263e82;

    font-family:Tahoma,Arial,sans-serif;

    font-size:23px;

    text-align:right;
}

.note-box::placeholder{
    color:#8995b8;
    opacity:1;
}

.counter{
    position:absolute;

    left:69px;

    margin-top:-44px;

    color:#64739e;

    font-size:19px;

    font-weight:bold;

    direction:ltr;
}

/* =========================
   زر التالي
========================= */

.next{
    width:calc(100% - 130px);

    height:108px;

    margin:295px auto 42px;

    display:block;

    border:none;

    border-radius:18px;

    background:#8c9ac4;

    color:white;

    font-family:Tahoma,Arial,sans-serif;

    font-size:30px;

    font-weight:bold;

    cursor:pointer;

    transition:.15s;
}

.next:active{
    transform:scale(.98);
    background:#7e8db8;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    .header{
        height:161px;
    }

    .status{
        top:27px;
        left:45px;
        right:43px;
    }

    .header-content{
        left:24px;
        right:24px;
        bottom:20px;
    }

    .header-title{
        font-size:27px;
    }

    .content{
        padding-left:44px;
        padding-right:44px;
    }

}

/* الشاشات الصغيرة */

@media(max-width:450px){

    .header-title{
        font-size:21px;

        left:135px;
        right:52px;
    }

    .avatar{
        left:64px;
        width:50px;
        height:50px;
    }

    .content{
        padding-left:22px;
        padding-right:22px;
    }

    .label{
        font-size:25px;
    }

    .qr{
        width:88px;
        height:94px;
    }

    .payment-box{
        height:94px;
    }

    .favorite{
        font-size:21px;
    }

    .star{
        font-size:32px;
    }

    .amount-section{
        margin-top:48px;
    }

    .currency{
        width:82px;
        height:90px;
        font-size:18px;
    }

    .amount-input{
        height:90px;
        font-size:22px;
    }

    .balance{
        font-size:19px;
    }

    .note-label{
        font-size:21px;
    }

    .note-box{
        height:120px;
        font-size:20px;
    }

    .next{
        width:76%;
        height:108px;

        margin-top:270px;

        font-size:28px;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <!-- شريط الحالة -->
        <div class="status">

            <div class="status-left">
                <span>▰</span>
                <span>٪١٣</span>
                <span>▥</span>
                <span>4G</span>
                <span>▣</span>
                <span>◷</span>
            </div>

            <div class="status-right">
                <span>▧</span>
                <span>٣</span>
                <span>◉</span>
                <span>◌</span>
                <span>٨٠:٤٠</span>
            </div>

        </div>


        <div class="header-content">

            <!-- مساعدة -->
            <button
                class="help"
                onclick="showMessage('مساعدة')">
                ?
            </button>


            <!-- صورة المستخدم -->
            <img
                class="avatar"
                src="avatar.png"
                alt="Profile">


            <!-- العنوان -->
            <div class="header-title">
                دفع مشتريات وخدمات
            </div>


            <!-- السهم -->
            <div
                class="back"
                onclick="history.back()">
            </div>

        </div>

    </header>


    <!-- =========================
         CONTENT
    ========================== -->

    <main class="content">

        <!-- رقم نقطة الدفع -->

        <section class="payment-area">

            <div class="label">
                أدخل رقم نقطة الدفع
            </div>


            <div class="payment-row">

                <!-- QR -->

                <button
                    class="qr"
                    onclick="showMessage('فتح قارئ QR')">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2">

                        <rect
                            x="3"
                            y="3"
                            width="7"
                            height="7"
                            rx="1"/>

                        <rect
                            x="14"
                            y="3"
                            width="7"
                            height="7"
                            rx="1"/>

                        <rect
                            x="3"
                            y="14"
                            width="7"
                            height="7"
                            rx="1"/>

                        <path d="M14 14h3v3h-3z"/>
                        <path d="M18 18h3v3h-3z"/>
                        <path d="M14 18v3"/>
                        <path d="M18 14h3"/>

                    </svg>

                </button>


                <!-- الحقل -->

                <div class="payment-box">

                    <div class="user-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="currentColor">

                            <circle
                                cx="12"
                                cy="7"
                                r="4"/>

                            <path
                                d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/>

                        </svg>

                    </div>


                    <input
                        class="payment-input"
                        id="payment"
                        type="text"
                        inputmode="numeric"
                        autocomplete="off">

                </div>

            </div>


            <!-- المفضلة -->

            <div
                class="favorite"
                onclick="favoritePoint()">

                <span class="star">★</span>

                <span>
                    اختر من المفضلة
                </span>

            </div>

        </section>


        <!-- =========================
             مبلغ العملية
        ========================== -->

        <section class="amount-section">

            <div class="label">
                مبلغ العملية
            </div>


            <div class="amount-row">

                <!-- العملة -->

                <select
                    class="currency"
                    id="currency">

                    <option>ريال</option>
                    <option>دولار</option>
                    <option>ريال سعودي</option>

                </select>


                <!-- المبلغ -->

                <input
                    class="amount-input"
                    id="amount"
                    type="number"
                    inputmode="decimal"
                    placeholder="أدخل المبلغ">

            </div>


            <!-- الرصيد -->

            <div class="balance">

                <div class="eye"
                     onclick="toggleBalance()">
                </div>

                <div class="balance-text">
                    رصيدي
                    <span id="balance">
                        ****** ريال
                    </span>
                </div>

            </div>

        </section>


        <!-- =========================
             الملاحظة
        ========================== -->

        <section class="note-section">

            <div class="note-label">
                ملاحظة (اختياري)
            </div>


            <textarea
                id="note"
                maxlength="30"
                class="note-box"
                placeholder="أضف ملاحظة هنا..."></textarea>


            <div
                class="counter"
                id="counter">
                0/30
            </div>

        </section>


        <!-- =========================
             التالي
        ========================== -->

        <button
            class="next"
            onclick="nextStep()">

            التالي

        </button>

    </main>

</div>


<script>

/* =========================
   رسالة
========================= */

function showMessage(text){

    alert(text);

}


/* =========================
   المفضلة
========================= */

function favoritePoint(){

    document.getElementById("payment").value = "123456";

}


/* =========================
   الرصيد
========================= */

let visible = false;

function toggleBalance(){

    const balance =
        document.getElementById("balance");

    if(visible){

        balance.textContent =
            "****** ريال";

        visible = false;

    }else{

        balance.textContent =
            "25,000 ريال";

        visible = true;

    }

}


/* =========================
   عداد الملاحظة
========================= */

const note =
    document.getElementById("note");

const counter =
    document.getElementById("counter");


note.addEventListener("input", function(){

    counter.textContent =
        this.value.length + "/30";

});


/* =========================
   التالي
========================= */

function nextStep(){

    const payment =
        document.getElementById("payment").value.trim();

    const amount =
        document.getElementById("amount").value.trim();

    if(payment === ""){

        alert("أدخل رقم نقطة الدفع");

        document
            .getElementById("payment")
            .focus();

        return;
    }

    if(amount === ""){

        alert("أدخل المبلغ");

        document
            .getElementById("amount")
            .focus();

        return;
    }

    alert("تم الانتقال إلى الخطوة التالية");

}


/* =========================
   رقم نقطة الدفع
========================= */

document
    .getElementById("payment")
    .addEventListener("input", function(){

        this.value =
            this.value.replace(/[^0-9]/g,"");

    });

</script>

</body>
</html>
