<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   user-scalable=no,
                   viewport-fit=cover">

    <meta name="theme-color" content="#F47121">

    <title>دفع مشتريات وخدمات</title>

    <!-- الخط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        /* =====================================================
           الإعدادات الأساسية
        ===================================================== */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #F7F7F7;
            font-family: "Tajawal", Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            border: 0;
            outline: none;
        }


        /* =====================================================
           التطبيق
        ===================================================== */

        .app {
            width: 100%;
            max-width: 691px;
            min-height: 100dvh;
            margin: 0 auto;
            background: #F7F7F7;
            position: relative;
        }


        /* =====================================================
           الهيدر البرتقالي
        ===================================================== */

        .top-header {
            width: 100%;
            height: 162px;

            background: #F47121;

            color: white;

            position: relative;

            display: flex;
            align-items: flex-end;

            padding:
                0
                29px
                22px
                29px;

            padding-top: env(safe-area-inset-top);

            box-shadow: none;
        }


        .header-content {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            direction: rtl;
        }


        /* عنوان الهيدر */

        .header-title {
            display: flex;
            align-items: center;
            gap: 28px;

            flex: 1;
        }


        .header-title h1 {
            margin: 0;

            color: #FFFFFF;

            font-size: 28px;
            line-height: 1;

            font-weight: 800;

            white-space: nowrap;
        }


        /* الصورة الدائرية */

        .profile {
            width: 52px;
            height: 52px;

            border-radius: 50%;

            overflow: hidden;

            flex-shrink: 0;

            background: #ddd;

            border: 2px solid rgba(255,255,255,.25);
        }


        .profile img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* سهم الرجوع */

        .back-arrow {
            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            flex-shrink: 0;
        }


        .back-arrow svg {
            width: 34px;
            height: 34px;

            stroke: white;
            stroke-width: 2.6;

            fill: none;
        }


        /* علامة الاستفهام */

        .help-button {
            position: absolute;

            left: 27px;
            bottom: 27px;

            width: 35px;
            height: 35px;

            border: 4px solid white;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 23px;
            font-weight: 800;

            line-height: 1;
        }


        /* =====================================================
           المحتوى
        ===================================================== */

        .content {
            padding: 43px 44px 35px;
        }


        /* =====================================================
           العناوين
        ===================================================== */

        .section-title {
            margin: 0 0 27px;

            color: #243A85;

            font-size: 31px;
            line-height: 1.2;

            font-weight: 800;

            text-align: right;
        }


        /* =====================================================
           رقم نقطة الدفع
        ===================================================== */

        .payment-point-row {
            display: flex;
            gap: 14px;

            width: 100%;

            direction: ltr;
        }


        /* زر QR */

        .qr-button {
            width: 87px;
            height: 95px;

            background: #FFFFFF;

            border: 2px solid #D8DCE5;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }


        .qr-button svg {
            width: 36px;
            height: 36px;

            stroke: #F47121;
            fill: none;

            stroke-width: 2;
        }


        /* حقل نقطة الدفع */

        .point-input-wrapper {
            height: 95px;

            flex: 1;

            position: relative;

            background: #FFFFFF;

            border: 2px solid #F47121;

            border-radius: 15px;

            display: flex;
            align-items: center;

            direction: ltr;
        }


        .person-icon {
            width: 48px;
            height: 48px;

            margin-left: 30px;

            flex-shrink: 0;
        }


        .person-icon svg {
            width: 100%;
            height: 100%;

            fill: #243A85;
        }


        #paymentPoint {
            width: 100%;
            height: 100%;

            border: none;
            outline: none;

            background: transparent;

            color: #243A85;

            font-size: 35px;
            font-weight: 700;

            text-align: right;

            padding:
                0
                24px
                0
                12px;

            direction: ltr;
        }


        #paymentPoint::placeholder {
            color: transparent;
        }


        /* =====================================================
           المفضلة
        ===================================================== */

        .favorite {
            margin-top: 32px;

            display: flex;
            align-items: center;
            justify-content: flex-start;

            gap: 10px;

            color: #4A5B8B;

            font-size: 25px;
            font-weight: 700;

            text-decoration: underline;

            text-decoration-thickness: 1px;

            cursor: pointer;
        }


        .favorite-star {
            color: #F4B900;

            font-size: 33px;

            line-height: 1;
        }


        /* =====================================================
           عنوان مبلغ العملية
        ===================================================== */

        .amount-title {
            margin-top: 57px;
            margin-bottom: 35px;

            color: #243A85;

            font-size: 31px;
            font-weight: 800;

            text-align: right;
        }


        /* =====================================================
           المبلغ + العملة
        ===================================================== */

        .amount-row {
            width: 100%;

            display: flex;
            gap: 14px;

            direction: ltr;
        }


        .amount-box {
            height: 106px;

            flex: 1;

            background: #FFFFFF;

            border: 2px solid #D8DCE5;

            border-radius: 15px;

            display: flex;
            align-items: center;

            transition:
                border-color .15s ease,
                box-shadow .15s ease;
        }


        .amount-box.active {
            border-color: #F47121;
        }


        #amount {
            width: 100%;
            height: 100%;

            background: transparent;

            border: 0;
            outline: none;

            color: #243A85;

            font-size: 37px;

            font-weight: 700;

            text-align: right;

            direction: ltr;

            padding: 0 25px;
        }


        #amount::placeholder {
            color: #8B98BA;

            font-size: 35px;

            font-weight: 500;

            opacity: 1;
        }


        /* العملة */

        .currency-button {
            width: 162px;
            height: 106px;

            background: #FFFFFF;

            border: 2px solid #D8DCE5;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 25px;

            color: #243A85;

            font-size: 25px;

            font-weight: 800;

            direction: rtl;

            cursor: pointer;
        }


        .currency-arrow {
            width: 20px;
            height: 20px;

            border-left: 5px solid #243A85;
            border-bottom: 5px solid #243A85;

            transform: rotate(-45deg);

            margin-top: -8px;
        }


        /* =====================================================
           النص أسفل المبلغ
        ===================================================== */

        .amount-word {
            min-height: 45px;

            margin-top: 9px;

            color: #243A85;

            font-size: 24px;

            font-weight: 700;

            text-align: right;

            padding-right: 0;

            transition: opacity .15s ease;
        }


        /* =====================================================
           الرصيد
        ===================================================== */

        .balance {
            margin-top: 16px;

            display: flex;
            align-items: center;
            justify-content: flex-start;

            gap: 7px;

            color: #243A85;

            font-size: 25px;

            font-weight: 700;
        }


        .balance-icon {
            width: 39px;
            height: 39px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .balance-icon svg {
            width: 39px;
            height: 39px;
        }


        /* =====================================================
           الملاحظة
        ===================================================== */

        .note-title {
            margin-top: 43px;
            margin-bottom: 20px;

            color: #243A85;

            font-size: 27px;

            font-weight: 800;

            text-align: right;
        }


        .note-box {
            width: 100%;
            height: 122px;

            position: relative;

            background: #FFFFFF;

            border: 2px solid #D8DCE5;

            border-radius: 15px;
        }


        #note {
            width: 100%;
            height: 100%;

            resize: none;

            border: 0;
            outline: 0;

            background: transparent;

            color: #243A85;

            font-size: 25px;

            font-weight: 500;

            text-align: right;

            padding:
                22px
                20px
                38px;

            direction: rtl;
        }


        #note::placeholder {
            color: #8B98BA;

            opacity: 1;
        }


        .counter {
            position: absolute;

            bottom: 17px;
            left: 15px;

            color: #687AA5;

            font-size: 20px;

            font-weight: 500;

            direction: ltr;
        }


        /* =====================================================
           زر التالي
        ===================================================== */

        .next-button {
            width: calc(100% - 65px);

            height: 108px;

            margin:
                294px
                auto
                0;

            border-radius: 20px;

            background: #8C98BE;

            color: white;

            font-size: 34px;

            font-weight: 800;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: not-allowed;

            transition:
                background .2s ease,
                transform .1s ease,
                box-shadow .2s ease;
        }


        .next-button.active {
            background: #243A85;

            cursor: pointer;

            box-shadow:
                0 5px 10px rgba(36,58,133,.18);
        }


        .next-button.active:active {
            transform: scale(.985);
        }


        /* =====================================================
           قائمة العملات
        ===================================================== */

        .currency-menu {
            position: fixed;

            z-index: 100;

            inset: 0;

            display: none;

            align-items: flex-end;

            justify-content: center;

            background: rgba(0,0,0,.25);
        }


        .currency-menu.show {
            display: flex;
        }


        .currency-panel {
            width: min(691px, 100%);

            background: white;

            border-radius:
                25px
                25px
                0
                0;

            padding: 25px;

            box-shadow:
                0 -5px 30px rgba(0,0,0,.12);
        }


        .currency-panel h3 {
            margin: 0 0 20px;

            color: #243A85;

            font-size: 25px;

            text-align: center;
        }


        .currency-option {
            width: 100%;

            height: 65px;

            background: #F7F7F7;

            border-radius: 12px;

            margin-top: 10px;

            color: #243A85;

            font-size: 22px;

            font-weight: 700;

            cursor: pointer;
        }


        /* =====================================================
           استجابة الشاشات الصغيرة
        ===================================================== */

        @media (max-width: 600px) {

            .top-header {
                height: 145px;

                padding-left: 22px;
                padding-right: 22px;
                padding-bottom: 19px;
            }


            .header-title {
                gap: 16px;
            }


            .header-title h1 {
                font-size: 22px;
            }


            .profile {
                width: 45px;
                height: 45px;
            }


            .content {
                padding:
                    38px
                    24px
                    30px;
            }


            .section-title,
            .amount-title {
                font-size: 27px;
            }


            .payment-point-row {
                gap: 10px;
            }


            .qr-button {
                width: 78px;
                height: 88px;
            }


            .point-input-wrapper {
                height: 88px;
            }


            #paymentPoint {
                font-size: 30px;
            }


            .person-icon {
                margin-left: 17px;
            }


            .amount-row {
                gap: 10px;
            }


            .currency-button {
                width: 135px;
                font-size: 22px;
                gap: 17px;
            }


            .amount-box,
            .currency-button {
                height: 95px;
            }


            #amount {
                font-size: 32px;
            }


            #amount::placeholder {
                font-size: 29px;
            }


            .amount-word {
                font-size: 21px;
            }


            .balance {
                font-size: 22px;
            }


            .note-title {
                font-size: 24px;
            }


            .next-button {
                width: calc(100% - 40px);

                height: 92px;

                margin-top: 250px;

                font-size: 30px;
            }
        }


        @media (max-width: 390px) {

            .content {
                padding-left: 18px;
                padding-right: 18px;
            }


            .currency-button {
                width: 120px;
            }


            .next-button {
                width: calc(100% - 20px);
            }
        }

    </style>
</head>


<body>

<div class="app">

    <!-- =====================================================
         الهيدر
    ====================================================== -->

    <header class="top-header">

        <div class="header-content">

            <div class="header-title">

                <div class="profile">

                    <!-- صورة افتراضية -->
                    <svg viewBox="0 0 100 100"
                         xmlns="http://www.w3.org/2000/svg">

                        <rect width="100"
                              height="100"
                              fill="#31518F"/>

                        <circle cx="50"
                                cy="35"
                                r="18"
                                fill="#D8A678"/>

                        <path d="M25 92
                                 C27 67 38 57 50 57
                                 C62 57 73 67 75 92Z"
                              fill="#222B40"/>

                        <path d="M30 36
                                 C31 18 41 8 54 10
                                 C68 11 73 24 70 39
                                 C64 29 55 25 43 27
                                 C39 33 34 36 30 36Z"
                              fill="#1C2330"/>

                    </svg>

                </div>

                <h1>دفع مشتريات وخدمات</h1>

            </div>


            <!-- سهم الرجوع -->

            <div class="back-arrow">

                <svg viewBox="0 0 40 40">

                    <path d="M7 20H32"></path>

                    <path d="M22 9L33 20L22 31"></path>

                </svg>

            </div>

        </div>


        <div class="help-button">؟</div>

    </header>



    <!-- =====================================================
         المحتوى
    ====================================================== -->

    <main class="content">


        <!-- رقم نقطة الدفع -->

        <h2 class="section-title">
            أدخل رقم نقطة الدفع
        </h2>


        <div class="payment-point-row">


            <!-- QR -->

            <button class="qr-button"
                    type="button"
                    aria-label="QR">

                <svg viewBox="0 0 40 40">

                    <rect x="4"
                          y="4"
                          width="11"
                          height="11"
                          rx="1"></rect>

                    <rect x="25"
                          y="4"
                          width="11"
                          height="11"
                          rx="1"></rect>

                    <rect x="4"
                          y="25"
                          width="11"
                          height="11"
                          rx="1"></rect>

                    <path d="M25 25H29V29H25Z"></path>

                    <path d="M32 25V29H36"></path>

                    <path d="M25 33H29"></path>

                    <path d="M32 32V36"></path>

                </svg>

            </button>


            <!-- رقم نقطة الدفع -->

            <div class="point-input-wrapper">

                <div class="person-icon">

                    <svg viewBox="0 0 64 64">

                        <circle cx="32"
                                cy="20"
                                r="13"></circle>

                        <path d="M10 57
                                 C11 42 20 34 32 34
                                 C44 34 53 42 54 57Z"></path>

                    </svg>

                </div>


                <input
                    id="paymentPoint"
                    type="text"
                    inputmode="numeric"
                    maxlength="12"
                    autocomplete="off"
                    aria-label="رقم نقطة الدفع"
                >

            </div>

        </div>


        <!-- المفضلة -->

        <div class="favorite">

            <span class="favorite-star">★</span>

            <span>اختر من المفضلة</span>

        </div>



        <!-- مبلغ العملية -->

        <h2 class="amount-title">
            مبلغ العملية
        </h2>


        <div class="amount-row">


            <!-- المبلغ -->

            <div class="amount-box"
                 id="amountBox">

                <input
                    id="amount"
                    type="text"
                    inputmode="decimal"
                    autocomplete="off"
                    placeholder="أدخل المبلغ"
                    aria-label="المبلغ"
                >

            </div>


            <!-- العملة -->

            <button
                class="currency-button"
                id="currencyButton"
                type="button"
            >

                <span id="currencyText">
                    ر.ي
                </span>

                <span class="currency-arrow"></span>

            </button>

        </div>


        <!-- كتابة المبلغ -->

        <div
            class="amount-word"
            id="amountWord"
        ></div>


        <!-- الرصيد -->

        <div class="balance">

            <div class="balance-icon">

                <svg viewBox="0 0 50 50">

                    <circle cx="25"
                            cy="25"
                            r="22"
                            fill="none"
                            stroke="#243A85"
                            stroke-width="2"/>

                    <circle cx="25"
                            cy="25"
                            r="17"
                            fill="#F47121"/>

                    <path d="M18 30
                             L32 18
                             M20 20
                             H30
                             V30"
                          fill="none"
                          stroke="white"
                          stroke-width="3"
                          stroke-linecap="round"/>

                </svg>

            </div>

            <span>
                رصيدي
            </span>

            <span>
                ****** ر.ي
            </span>

        </div>



        <!-- الملاحظة -->

        <h3 class="note-title">
            ملاحظة (اختياري)
        </h3>


        <div class="note-box">

            <textarea
                id="note"
                maxlength="30"
                placeholder="أضف ملاحظة هنا..."
            ></textarea>

            <div class="counter">
                <span id="counter">0</span>/30
            </div>

        </div>



        <!-- التالي -->

        <button
            id="nextButton"
            class="next-button"
            type="button"
            disabled
        >
            التالي
        </button>


    </main>

</div>



<!-- =========================================================
     قائمة العملة
========================================================= -->

<div
    class="currency-menu"
    id="currencyMenu"
>

    <div class="currency-panel">

        <h3>اختر العملة</h3>

        <button
            class="currency-option"
            data-currency="ر.ي"
        >
            ريال يمني - ر.ي
        </button>

        <button
            class="currency-option"
            data-currency="ر.س"
        >
            ريال سعودي - ر.س
        </button>

        <button
            class="currency-option"
            data-currency="دولار"
        >
            دولار أمريكي
        </button>

    </div>

</div>



<script>

    /* =====================================================
       العناصر
    ===================================================== */

    const paymentPoint =
        document.getElementById("paymentPoint");

    const amount =
        document.getElementById("amount");

    const amountBox =
        document.getElementById("amountBox");

    const amountWord =
        document.getElementById("amountWord");

    const note =
        document.getElementById("note");

    const counter =
        document.getElementById("counter");

    const nextButton =
        document.getElementById("nextButton");

    const currencyButton =
        document.getElementById("currencyButton");

    const currencyMenu =
        document.getElementById("currencyMenu");

    const currencyText =
        document.getElementById("currencyText");



    /* =====================================================
       السماح بالأرقام فقط لنقطة الدفع
    ===================================================== */

    paymentPoint.addEventListener("input", function () {

        this.value =
            this.value.replace(/\D/g, "");

        updateButton();

    });



    /* =====================================================
       تنسيق المبلغ
       
       مثال:
       1000  → 1,000
       10000 → 10,000
       ===================================================== */

    amount.addEventListener("input", function () {

        let value =
            this.value.replace(/[^\d.]/g, "");

        /*
         منع أكثر من فاصلة عشرية
        */

        const parts = value.split(".");

        if (parts.length > 2) {

            value =
                parts[0] + "." + parts.slice(1).join("");

        }


        let integerPart =
            parts[0] || "";


        let decimalPart =
            parts[1] || "";


        /*
         إزالة الأصفار غير الضرورية
        */

        if (integerPart.length > 1) {

            integerPart =
                integerPart.replace(/^0+(?=\d)/, "");

        }


        /*
         إضافة الفواصل
        */

        if (integerPart) {

            integerPart =
                Number(integerPart).toLocaleString("en-US");

        }


        if (parts.length > 1) {

            this.value =
                integerPart + "." + decimalPart;

        } else {

            this.value =
                integerPart;

        }


        /*
         تغيير حدود الحقل
        */

        if (this.value.length > 0) {

            amountBox.classList.add("active");

        } else {

            amountBox.classList.remove("active");

        }


        updateAmountWord();

        updateButton();

    });



    /* =====================================================
       تحويل الرقم إلى كلمة بسيطة
    ===================================================== */

    function updateAmountWord() {

        let raw =
            amount.value.replace(/,/g, "");

        if (!raw) {

            amountWord.textContent = "";

            return;

        }


        let number =
            parseFloat(raw);


        if (isNaN(number)) {

            amountWord.textContent = "";

            return;

        }


        /*
         في الصورة يظهر:
         1,000
         وأسفلها:
         ألف ري
        */

        if (number === 1000) {

            amountWord.textContent =
                "ألف ر.ي";

        }

        else if (number === 2000) {

            amountWord.textContent =
                "ألفان ر.ي";

        }

        else if (number === 3000) {

            amountWord.textContent =
                "ثلاثة آلاف ر.ي";

        }

        else if (number === 4000) {

            amountWord.textContent =
                "أربعة آلاف ر.ي";

        }

        else if (number === 5000) {

            amountWord.textContent =
                "خمسة آلاف ر.ي";

        }

        else {

            amountWord.textContent = "";

        }

    }



    /* =====================================================
       عداد الملاحظة
    ===================================================== */

    note.addEventListener("input", function () {

        counter.textContent =
            this.value.length;

    });



    /* =====================================================
       تفعيل زر التالي
    ===================================================== */

    function updateButton() {

        const point =
            paymentPoint.value.trim();

        const money =
            amount.value.replace(/,/g, "").trim();


        /*
         يجب أن يوجد رقم نقطة دفع
         ومبلغ
        */

        if (
            point.length > 0 &&
            money.length > 0 &&
            parseFloat(money) > 0
        ) {

            nextButton.disabled = false;

            nextButton.classList.add("active");

        }

        else {

            nextButton.disabled = true;

            nextButton.classList.remove("active");

        }

    }



    /* =====================================================
       فتح قائمة العملات
    ===================================================== */

    currencyButton.addEventListener("click", function () {

        currencyMenu.classList.add("show");

    });



    /* =====================================================
       اختيار العملة
    ===================================================== */

    document.querySelectorAll(".currency-option")
        .forEach(function (button) {

            button.addEventListener("click", function () {

                currencyText.textContent =
                    this.dataset.currency;

                currencyMenu.classList.remove("show");

            });

        });



    /* =====================================================
       إغلاق قائمة العملات عند الضغط خارجها
    ===================================================== */

    currencyMenu.addEventListener("click", function (event) {

        if (event.target === currencyMenu) {

            currencyMenu.classList.remove("show");

        }

    });



    /* =====================================================
       زر التالي
    ===================================================== */

    nextButton.addEventListener("click", function () {

        if (this.disabled) {
            return;
        }


        const point =
            paymentPoint.value;

        const money =
            amount.value;

        const noteValue =
            note.value;


        alert(
            "رقم نقطة الدفع: " +
            point +
            "\nالمبلغ: " +
            money +
            " " +
            currencyText.textContent +
            (noteValue
                ? "\nالملاحظة: " + noteValue
                : "")
        );

    });



    /* =====================================================
       منع ظهور لوحة المفاتيح بطريقة غريبة
       عند الضغط على الأرقام
    ===================================================== */

    paymentPoint.addEventListener("focus", function () {

        this.setSelectionRange(
            this.value.length,
            this.value.length
        );

    });



    /* =====================================================
       تشغيل أولي
    ===================================================== */

    updateButton();

</script>

</body>
</html>
