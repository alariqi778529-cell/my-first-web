<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE Cash - دفع مشتريات وخدمات</title>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- خط Tajawal من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-orange: #f36c21;
            --text-dark-blue: #1c2b5e;
            --border-orange: #f36c21;
            --border-gray: #e2e8f0;
            --text-placeholder: #a0aec0;
            --btn-disabled: #8d98ba;
            --star-yellow: #f59e0b;
        }

        body {
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 880px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow-y: auto;
        }

        @media (min-width: 480px) {
            .app-container {
                height: 92vh;
                border-radius: 24px;
                overflow: hidden;
            }
        }

        .app-header {
            background-color: var(--primary-orange);
            color: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            flex-grow: 1;
            text-align: center;
            margin-right: -10px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-user-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-container {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            overflow: hidden;
        }

        .user-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .help-btn {
            font-size: 1.35rem;
        }

        .app-content {
            padding: 24px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            color: var(--text-dark-blue);
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 12px;
            text-align: center;
        }

        .input-with-qr {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 0 14px;
            height: 52px;
            width: 100%;
        }

        .primary-border {
            border: 1.5px solid var(--border-orange);
        }

        .default-border {
            border: 1.5px solid var(--border-gray);
        }

        .input-icon {
            color: var(--text-dark-blue);
            font-size: 1.2rem;
            margin-left: 10px;
        }

        .custom-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 1.05rem;
            color: var(--text-dark-blue);
            font-weight: 600;
            background: transparent;
        }

        .custom-input::placeholder {
            color: var(--text-placeholder);
            font-weight: 500;
        }

        .qr-btn {
            width: 52px;
            height: 52px;
            border: 1.5px solid var(--border-gray);
            border-radius: 12px;
            background-color: #ffffff;
            color: var(--primary-orange);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .favorites-container {
            display: flex;
            justify-content: flex-end;
            margin-top: -10px;
            margin-bottom: 24px;
        }

        .favorites-btn {
            background: none;
            border: none;
            color: var(--text-dark-blue);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .star-icon {
            color: var(--star-yellow);
            font-size: 1.05rem;
        }

        .amount-input-group {
            display: flex;
            gap: 10px;
        }

        .amount-field {
            flex: 1;
        }

        .currency-selector {
            width: 90px;
            height: 52px;
            border: 1.5px solid var(--border-gray);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #ffffff;
            color: var(--text-dark-blue);
            font-weight: 700;
            cursor: pointer;
        }

        .dropdown-icon {
            font-size: 0.8rem;
            color: var(--text-dark-blue);
        }

        .balance-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 28px;
        }

        .balance-toggle-btn {
            background: none;
            border: none;
            color: var(--primary-orange);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .balance-text {
            color: var(--text-dark-blue);
            font-size: 1rem;
            font-weight: 700;
        }

        .textarea-wrapper {
            position: relative;
            border: 1.5px solid var(--border-gray);
            border-radius: 12px;
            padding: 12px 14px 28px 14px;
            background-color: #ffffff;
        }

        .custom-textarea {
            width: 100%;
            height: 70px;
            border: none;
            outline: none;
            resize: none;
            font-size: 1rem;
            color: var(--text-dark-blue);
            font-weight: 500;
        }

        .custom-textarea::placeholder {
            color: var(--text-placeholder);
        }

        .char-counter {
            position: absolute;
            bottom: 8px;
            right: 14px;
            font-size: 0.85rem;
            color: var(--text-dark-blue);
            font-weight: 600;
        }

        .submit-container {
            margin-top: auto;
            padding-top: 20px;
            padding-bottom: 10px;
        }

        .btn-submit {
            width: 100%;
            height: 50px;
            background-color: var(--btn-disabled);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #7b87a8;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- شريط العنوان العلوي -->
        <header class="app-header">
            <button class="icon-btn back-btn" aria-label="رجوع">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <h1 class="header-title">دفع مشتريات وخدمات</h1>
            <div class="header-user-section">
                <div class="avatar-container">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80" alt="صورة المستخدم" class="user-avatar">
                </div>
                <button class="icon-btn help-btn" aria-label="مساعدة">
                    <i class="fa-regular fa-circle-question"></i>
                </button>
            </div>
        </header>

        <!-- محتوى الصفحة الرئيسي -->
        <main class="app-content">
            <form id="paymentForm" onsubmit="event.preventDefault();">
                
                <!-- قسم رقم نقطة الدفع -->
                <div class="form-group">
                    <label class="input-label" for="pointNumber">أدخل رقم نقطة الدفع</label>
                    <div class="input-with-qr">
                        <div class="input-wrapper primary-border">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" id="pointNumber" class="custom-input" placeholder="" required>
                        </div>
                        <button type="button" class="qr-btn" aria-label="مسح QR">
                            <i class="fa-solid fa-qrcode"></i>
                        </button>
                    </div>
                </div>

                <!-- زر المفضلة -->
                <div class="favorites-container">
                    <button type="button" class="favorites-btn">
                        <i class="fa-solid fa-star star-icon"></i>
                        <span>اختر من المفضلة</span>
                    </button>
                </div>

                <!-- قسم مبلغ العملية -->
                <div class="form-group">
                    <label class="input-label" for="amount">مبلغ العملية</label>
                    <div class="amount-input-group">
                        <div class="input-wrapper default-border amount-field">
                            <input type="number" id="amount" class="custom-input" placeholder="أدخل المبلغ" required>
                        </div>
                        <div class="currency-selector">
                            <span class="currency-text">ر.ي</span>
                            <i class="fa-solid fa-chevron-down dropdown-icon"></i>
                        </div>
                    </div>
                </div>

                <!-- قسم الرصيد -->
                <div class="balance-container">
                    <button type="button" id="toggleBalanceBtn" class="balance-toggle-btn" aria-label="إظهار/إخفاء الرصيد">
                        <i class="fa-solid fa-eye-slash balance-icon" id="balanceIcon"></i>
                    </button>
                    <span class="balance-text">رصيدي <strong id="balanceValue">******</strong> ر.ي</span>
                </div>

                <!-- قسم الملاحظة -->
                <div class="form-group">
                    <label class="input-label" for="note">ملاحظة (اختياري)</label>
                    <div class="textarea-wrapper">
                        <textarea id="note" class="custom-textarea" maxlength="30" placeholder="أضف ملاحظة هنا..."></textarea>
                        <span class="char-counter" id="charCounter">0/30</span>
                    </div>
                </div>

                <!-- زر التالي -->
                <div class="submit-container">
                    <button type="submit" class="btn-submit" id="submitBtn">التالي</button>
                </div>

            </form>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const noteTextarea = document.getElementById('note');
            const charCounter = document.getElementById('charCounter');
            const toggleBalanceBtn = document.getElementById('toggleBalanceBtn');
            const balanceValue = document.getElementById('balanceValue');
            const balanceIcon = document.getElementById('balanceIcon');
            const paymentForm = document.getElementById('paymentForm');

            let isBalanceVisible = false;
            const actualBalance = "50,000";

            if (noteTextarea && charCounter) {
                noteTextarea.addEventListener('input', (e) => {
                    const currentLength = e.target.value.length;
                    charCounter.textContent = `${currentLength}/30`;
                });
            }

            if (toggleBalanceBtn && balanceValue && balanceIcon) {
                toggleBalanceBtn.addEventListener('click', () => {
                    isBalanceVisible = !isBalanceVisible;
                    if (isBalanceVisible) {
                        balanceValue.textContent = actualBalance;
                        balanceIcon.classList.remove('fa-eye-slash');
                        balanceIcon.classList.add('fa-eye');
                    } else {
                        balanceValue.textContent = '******';
                        balanceIcon.classList.remove('fa-eye-slash');
                        balanceIcon.classList.add('fa-eye-slash');
                    }
                });
            }

            if (paymentForm) {
                paymentForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const pointNumber = document.getElementById('pointNumber').value;
                    const amount = document.getElementById('amount').value;
                    const note = noteTextarea.value;

                    if (!pointNumber || !amount) {
                        alert('يرجى ملء جميع الحقول المطلوبة');
                        return;
                    }

                    alert(`تم الحفظ بنجاح:\nرقم نقطة الدفع: ${pointNumber}\nالمبلغ: ${amount} ر.ي\nالملاحظة: ${note || 'لا يوجد'}`);
                });
            }
        });
    </script>
</body>
</html>
