<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دفع مشتريات وخدمات</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --orange: #F36A20;
            --dark-blue: #243B86;
            --background: #F6F7FA;
            --white: #FFFFFF;
            --border: #E9EDF5;
            --placeholder: #B6BCCD;
            --button: #7F89B0;
            --yellow: #FFC107;
        }

        body {
            font-family:
                "Tahoma",
                "Arial",
                sans-serif;

            background: var(--background);
            color: var(--dark-blue);
            min-height: 100vh;
        }

        /* =========================================
           APP CONTAINER
        ========================================= */

        .app {
            width: 100%;
            min-height: 100vh;
            background: var(--background);
            overflow-x: hidden;
        }

        /* =========================================
           HEADER
        ========================================= */

        .header {
            height: 16vh;
            min-height: 105px;
            max-height: 135px;

            background: var(--orange);
            color: white;

            position: relative;

            display: flex;
            align-items: center;

            padding: 0 6%;
        }

        .header-content {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .header-title {
            flex: 1;

            text-align: center;

            font-size: clamp(19px, 5vw, 28px);
            font-weight: 700;

            white-space: nowrap;
        }

        .header-left,
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Help button */

        .help-button {
            width: 43px;
            height: 43px;

            border-radius: 50%;
            border: none;

            background: white;
            color: var(--orange);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 2px 5px rgba(0,0,0,.08);

            transition: .2s;
        }

        .help-button:hover {
            transform: scale(1.05);
        }

        /* Avatar */

        .avatar {
            width: 48px;
            height: 48px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #79c9e8,
                    #ffffff 48%,
                    #4e9fc4
                );

            border: 2px solid rgba(255,255,255,.8);

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 21px;
            font-weight: bold;

            overflow: hidden;
        }

        .avatar::after {
            content: "👤";
            filter: grayscale(1);
            opacity: .8;
        }

        /* =========================================
           MAIN
        ========================================= */

        .main {
            width: 100%;
            max-width: 700px;

            margin: auto;

            padding:
                25px
                8%
                45px;

            position: relative;
        }

        /* =========================================
           LABELS
        ========================================= */

        .section-label {
            width: 100%;

            text-align: right;

            color: var(--dark-blue);

            font-size: clamp(15px, 4vw, 19px);

            font-weight: 700;

            margin-bottom: 10px;
        }

        /* =========================================
           PAYMENT POINT
        ========================================= */

        .payment-point {
            margin-bottom: 7px;
        }

        .payment-input-wrapper {
            height: 58px;

            background: white;

            border: 1.5px solid #F48A2F;

            border-radius: 12px;

            display: flex;
            align-items: center;

            padding: 5px 10px;

            direction: ltr;

            transition: .2s;
        }

        .payment-input-wrapper:focus-within {
            box-shadow:
                0 0 0 3px rgba(243,106,32,.12);
        }

        /* QR */

        .qr-button {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            background: white;

            border: 1px solid var(--border);

            border-radius: 9px;

            color: var(--orange);

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 26px;
        }

        /* Payment input */

        .payment-input {
            width: 100%;

            height: 100%;

            border: none;
            outline: none;

            background: transparent;

            padding: 0 12px;

            font-size: 17px;

            color: var(--dark-blue);

            text-align: right;
        }

        .payment-input::placeholder {
            color: var(--placeholder);
        }

        /* User icon */

        .person-icon {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--dark-blue);

            font-size: 22px;
        }

        /* =========================================
           FAVORITES
        ========================================= */

        .favorite {
            display: flex;
            justify-content: flex-start;
            align-items: center;

            gap: 5px;

            margin-top: 7px;

            font-size: 14px;

            cursor: pointer;

            color: var(--dark-blue);

            user-select: none;
        }

        .favorite-star {
            color: var(--yellow);

            font-size: 22px;

            line-height: 1;
        }

        .favorite:hover {
            text-decoration: underline;
        }

        /* =========================================
           AMOUNT
        ========================================= */

        .amount-section {
            margin-top: 24px;
        }

        .amount-row {
            display: flex;

            gap: 10px;

            width: 100%;

            direction: ltr;
        }

        .currency {
            width: 25%;

            height: 56px;

            background: white;

            border: 1px solid var(--border);

            border-radius: 11px;

            color: var(--dark-blue);

            font-size: 16px;

            font-weight: 600;

            padding: 0 13px;

            outline: none;

            cursor: pointer;
        }

        .currency:focus {
            border-color: var(--orange);
        }

        .amount-input {
            width: 75%;

            height: 56px;

            border: 1px solid var(--border);

            border-radius: 11px;

            background: white;

            outline: none;

            padding: 0 16px;

            color: var(--dark-blue);

            font-size: 18px;

            text-align: right;
        }

        .amount-input:focus {
            border-color: var(--orange);
            box-shadow:
                0 0 0 3px rgba(243,106,32,.08);
        }

        .amount-input::placeholder {
            color: var(--placeholder);
        }

        /* =========================================
           BALANCE
        ========================================= */

        .balance {
            margin-top: 16px;

            display: flex;

            align-items: center;

            justify-content: flex-start;

            gap: 9px;

            color: var(--dark-blue);

            font-size: 15px;

            direction: rtl;
        }

        .balance-value {
            font-weight: 600;
            letter-spacing: 2px;
        }

        .eye-button {
            width: 30px;
            height: 30px;

            border: none;

            border-radius: 50%;

            background: var(--orange);

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 15px;
        }

        /* =========================================
           NOTE
        ========================================= */

        .note-section {
            margin-top: 23px;
        }

        .note-box {
            width: 100%;

            min-height: 90px;

            background: white;

            border: 1px solid var(--border);

            border-radius: 12px;

            padding: 14px 16px;

            outline: none;

            resize: vertical;

            font-family: inherit;

            color: var(--dark-blue);

            font-size: 15px;

            text-align: right;
        }

        .note-box:focus {
            border-color: var(--orange);

            box-shadow:
                0 0 0 3px rgba(243,106,32,.08);
        }

        .note-box::placeholder {
            color: var(--placeholder);
        }

        /* =========================================
           NEXT BUTTON
        ========================================= */

        .next-button {
            width: 90%;

            height: 58px;

            margin:
                55px
                auto
                0;

            display: block;

            border: none;

            border-radius: 14px;

            background: var(--button);

            color: white;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform .15s,
                background .2s,
                box-shadow .2s;
        }

        .next-button:hover {
            background: #707ba5;

            box-shadow:
                0 5px 15px rgba(36,59,134,.16);
        }

        .next-button:active {
            transform: scale(.98);
        }

        /* =========================================
           DESKTOP
        ========================================= */

        @media (min-width: 768px) {

            body {
                display: flex;
                justify-content: center;
                align-items: center;

                padding: 20px;
            }

            .app {
                max-width: 480px;

                min-height: 850px;

                border-radius: 20px;

                overflow: hidden;

                box-shadow:
                    0 10px 45px rgba(0,0,0,.12);
            }

            .header {
                height: 115px;
            }

            .main {
                padding:
                    28px
                    35px
                    45px;
            }

            .next-button {
                width: 88%;
            }
        }

        /* =========================================
           SMALL MOBILE
        ========================================= */

        @media (max-width: 360px) {

            .header {
                padding: 0 4%;
            }

            .header-title {
                font-size: 17px;
            }

            .help-button {
                width: 38px;
                height: 38px;
            }

            .avatar {
                width: 42px;
                height: 42px;
            }

            .main {
                padding-left: 5%;
                padding-right: 5%;
            }

            .payment-input-wrapper {
                height: 53px;
            }

            .qr-button {
                width: 40px;
                height: 40px;
            }

            .currency {
                font-size: 14px;
                padding: 0 8px;
            }

            .next-button {
                width: 92%;
            }
        }

        /* =========================================
           TOAST MESSAGE
        ========================================= */

        .toast {
            position: fixed;

            bottom: 25px;
            left: 50%;

            transform:
                translate(-50%, 100px);

            background: #243B86;

            color: white;

            padding:
                12px
                22px;

            border-radius: 30px;

            font-size: 14px;

            opacity: 0;

            pointer-events: none;

            transition: .3s;

            z-index: 100;
        }

        .toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }
    </style>
</head>

<body>

<div class="app">

    <!-- ======================================
         HEADER
    ======================================= -->

    <header class="header">

        <div class="header-content">

            <div class="header-left">

                <button
                    class="help-button"
                    onclick="showHelp()"
                    aria-label="مساعدة">
                    ?
                </button>

                <div
                    class="avatar"
                    title="الحساب">
                </div>

            </div>


            <div class="header-title">
                دفع مشتريات وخدمات
            </div>


            <div class="header-right">
                <!-- مساحة للحفاظ على توازن التصميم -->
            </div>

        </div>

    </header>


    <!-- ======================================
         MAIN CONTENT
    ======================================= -->

    <main class="main">

        <!-- Payment Point -->

        <section class="payment-point">

            <div class="section-label">
                أدخل رقم نقطة الدفع
            </div>


            <div class="payment-input-wrapper">

                <button
                    class="qr-button"
                    onclick="scanQR()"
                    aria-label="مسح QR">

                    <svg
                        width="25"
                        height="25"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2">

                        <rect
                            x="3"
                            y="3"
                            width="7"
                            height="7"/>

                        <rect
                            x="14"
                            y="3"
                            width="7"
                            height="7"/>

                        <rect
                            x="3"
                            y="14"
                            width="7"
                            height="7"/>

                        <path d="M14 14h3v3h-3z"/>
                        <path d="M18 18h3v3h-3z"/>
                        <path d="M14 18v3"/>
                        <path d="M18 14h3"/>

                    </svg>

                </button>


                <input
                    id="paymentPoint"
                    class="payment-input"
                    type="text"
                    inputmode="numeric"
                    placeholder="أدخل رقم نقطة الدفع"
                    autocomplete="off"
                >


                <div class="person-icon">

                    <svg
                        width="23"
                        height="23"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2">

                        <circle
                            cx="12"
                            cy="8"
                            r="4"/>

                        <path
                            d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>

                    </svg>

                </div>

            </div>


            <div
                class="favorite"
                onclick="chooseFavorite()">

                <span class="favorite-star">
                    ★
                </span>

                <span>
                    اختيار من المفضلة
                </span>

            </div>

        </section>


        <!-- Amount -->

        <section class="amount-section">

            <div class="section-label">
                مبلغ العملية
            </div>


            <div class="amount-row">

                <select
                    id="currency"
                    class="currency">

                    <option value="ريال">
                        ريال
                    </option>

                    <option value="دولار">
                        دولار
                    </option>

                    <option value="سعودي">
                        ريال سعودي
                    </option>

                </select>


                <input
                    id="amount"
                    class="amount-input"
                    type="number"
                    inputmode="decimal"
                    placeholder="أدخل المبلغ"
                >

            </div>


            <!-- Balance -->

            <div class="balance">

                <span>
                    الرصيد المتاح:
                </span>

                <span
                    id="balanceValue"
                    class="balance-value">

                    •••••••

                </span>

                <button
                    id="eyeButton"
                    class="eye-button"
                    onclick="toggleBalance()"
                    aria-label="إظهار الرصيد">

                    <svg
                        width="17"
                        height="17"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2">

                        <path
                            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>

                        <circle
                            cx="12"
                            cy="12"
                            r="3"/>

                    </svg>

                </button>

            </div>

        </section>


        <!-- Note -->

        <section class="note-section">

            <div class="section-label">
                ملاحظة
                <span style="font-weight:400;">
                    (اختياري)
                </span>
            </div>


            <textarea
                id="note"
                class="note-box"
                placeholder="أضف ملاحظة هنا..."
            ></textarea>

        </section>


        <!-- Next -->

        <button
            class="next-button"
            onclick="goNext()">

            التالي

        </button>

    </main>

</div>


<!-- Toast -->

<div
    id="toast"
    class="toast">
</div>


<script>

    /* =========================================
       TOAST
    ========================================= */

    function showToast(message) {

        const toast =
            document.getElementById("toast");

        toast.textContent = message;

        toast.classList.add("show");

        setTimeout(() => {

            toast.classList.remove("show");

        }, 2500);
    }


    /* =========================================
       HELP
    ========================================= */

    function showHelp() {

        showToast(
            "أدخل رقم نقطة الدفع ثم أدخل مبلغ العملية"
        );
    }


    /* =========================================
       QR
    ========================================= */

    function scanQR() {

        showToast(
            "ميزة مسح QR جاهزة للربط بالكاميرا"
        );
    }


    /* =========================================
       FAVORITES
    ========================================= */

    function chooseFavorite() {

        const paymentPoint =
            document.getElementById("paymentPoint");

        paymentPoint.value = "123456";

        showToast(
            "تم اختيار نقطة الدفع من المفضلة"
        );
    }


    /* =========================================
       BALANCE
    ========================================= */

    let balanceVisible = false;


    function toggleBalance() {

        const balance =
            document.getElementById("balanceValue");

        if (!balanceVisible) {

            balance.textContent =
                "25,000 ريال";

            balanceVisible = true;

        } else {

            balance.textContent =
                "•••••••";

            balanceVisible = false;

        }
    }


    /* =========================================
       NEXT
    ========================================= */

    function goNext() {

        const paymentPoint =
            document.getElementById("paymentPoint").value.trim();

        const amount =
            document.getElementById("amount").value.trim();

        const currency =
            document.getElementById("currency").value;


        if (paymentPoint === "") {

            showToast(
                "يرجى إدخال رقم نقطة الدفع"
            );

            document
                .getElementById("paymentPoint")
                .focus();

            return;
        }


        if (amount === "") {

            showToast(
                "يرجى إدخال مبلغ العملية"
            );

            document
                .getElementById("amount")
                .focus();

            return;
        }


        showToast(
            "تم تجهيز العملية: " +
            amount +
            " " +
            currency
        );

    }


    /* =========================================
       NUMERIC PAYMENT POINT
    ========================================= */

    document
        .getElementById("paymentPoint")
        .addEventListener(
            "input",
            function () {

                this.value =
                    this.value.replace(
                        /[^0-9]/g,
                        ""
                    );

            }
        );


    /* =========================================
       AMOUNT VALIDATION
    ========================================= */

    document
        .getElementById("amount")
        .addEventListener(
            "input",
            function () {

                if (this.value < 0) {
                    this.value = 0;
                }

            }
        );

</script>

</body>
</html>
