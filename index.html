<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دفع مشتريات وخدمات</title>
  <!-- استدعاء خط Cairo ليتطابق مع تصميم الواجهة -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #fcfcfc;
      color: #1a2b4c;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* الحاوية الرئيسية للتطبيق */
    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }

    /* الشريط العلوي (Top Header) */
    .header {
      background-color: #F36F21;
      color: #ffffff;
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
    }

    .header-icon {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
    }

    /* محتوى الصفحة */
    .content {
      padding: 24px 16px;
    }

    .main-title {
      font-size: 20px;
      font-weight: 700;
      color: #1D2D5B;
      margin-bottom: 16px;
      text-align: right;
    }

    /* حاوية الإدخال والرمز */
    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    /* حقل الإدخال الرئيسي */
    .input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      border: 1.5px solid #E28C4A;
      border-radius: 10px;
      padding: 8px 12px;
      background-color: #ffffff;
      height: 52px;
    }

    .user-icon {
      width: 26px;
      height: 26px;
      fill: #1D2D5B;
    }

    .custom-input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 18px;
      margin-right: 10px;
      background: transparent;
      color: #1D2D5B;
      font-weight: 600;
    }

    /* المؤشر البرتقالي داخل الحقل */
    .caret-indicator {
      width: 2px;
      height: 22px;
      background-color: #E28C4A;
      margin-right: auto;
    }

    /* زر QR Code */
    .qr-button {
      width: 52px;
      height: 52px;
      border: 1px solid #E0E0E0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      cursor: pointer;
      flex-shrink: 0;
    }

    .qr-icon {
      width: 24px;
      height: 24px;
      fill: #E28C4A;
    }

    /* خيار "اختر من المفضلة" */
    .favorite-link {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      color: #1D2D5B;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      margin-top: 8px;
    }

    .favorite-link span {
      text-decoration: underline;
      cursor: pointer;
    }

    .star-icon {
      width: 18px;
      height: 18px;
      fill: #FFC107;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- الشريط العلوي -->
    <header class="header">
      <!-- أيقونة الاستفهام/المساعدة -->
      <svg class="header-icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>

      <!-- العنوان الرئيسي -->
      <h1 class="header-title">دفع مشتريات وخدمات</h1>

      <!-- أيقونة الرجوع -->
      <svg class="header-icon" viewBox="0 0 24 24">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </header>

    <!-- محتوى الصفحة -->
    <main class="content">
      <h2 class="main-title">أدخل رقم نقطة الدفع</h2>

      <div class="input-row">
        <!-- حقل الإدخال -->
        <div class="input-wrapper">
          <svg class="user-icon" viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <input type="text" class="custom-input" dir="ltr" />
          <div class="caret-indicator"></div>
        </div>

        <!-- زر رمز QR -->
        <button class="qr-button" aria-label="مسح QR">
          <svg class="qr-icon" viewBox="0 0 24 24">
            <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm-3 0h2v3h-2v-3zm3 3h3v5h-3v-5zm-3 2h2v3h-2v-3zm-2-2h2v2h-2v-2z"/>
          </svg>
        </button>
      </div>

      <!-- اختر من المفضلة -->
      <a href="#" class="favorite-link">
        <span>اختر من المفضلة</span>
        <svg class="star-icon" viewBox="0 0 24 24">
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>
      </a>
    </main>
  </div>

</body>
</html>
