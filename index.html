<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خزنَتي السرية</title>
    <style>
        body {
            background-color: #121212;
            color: #00ffcc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,255,204,0.2);
            border: 1px solid #00ffcc;
        }
        h1 { margin-bottom: 25px; font-size: 24px; text-transform: uppercase; }
        textarea {
            width: 100%;
            height: 100px;
            background: #2a2a2a;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 15px;
        }
        input[type="file"] { margin: 15px 0; color: #fff; }
        button {
            background: #00ffcc;
            color: #121212;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover { background: #00b38f; }
        .btn-id { background: #ffcc00; color: #000; margin-bottom: 15px; }
        .btn-id:hover { background: #cca300; }
        #status { margin-top: 15px; font-weight: bold; color: #ff3333; }
        #chatIdDisplay { margin: 10px 0; color: #ffcc00; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Vault To Telegram 🔐</h1>
    
    <button class="btn-id" onclick="getChatId()">🔄 جلب رقم الـ Chat ID للجروب تلقائياً</button>
    <div id="chatIdDisplay">اكتب رسالة بالجروب أولاً ثم اضغط الزر</div>

    <hr style="border: 0.5px solid #333; margin: 20px 0;">

    <textarea id="textInput" placeholder="اكتب النص السري هنا..."></textarea>
    <input type="file" id="fileInput">
    <button onclick="sendToVault()">إرسال إلى الخزنة 🚀</button>
    
    <div id="status"></div>
</div>

<script>
    // التوكن الخاص بك تم وضعه هنا مباشرة
    const TOKEN = "8811597212:AAH8i_l4zOD4TtNETuMIoM7vpKR814hAHgo";
    
    // متغير لحفظ الـ Chat ID بمجرد جلبة، أو يمكنك كتابته يدوياً هنا إذا عرفته لاحقاً
    let CHAT_ID = ""; 

    // دالة جلب الـ Chat ID تلقائياً
    async function getChatId() {
        const statusDiv = document.getElementById('status');
        const idDisplay = document.getElementById('chatIdDisplay');
        statusDiv.innerText = "جاري البحث...";
        
        try {
            let response = await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates`);
            let data = await response.json();
            
            if (data.result && data.result.length > 0) {
                // نأخذ آخر تحديث قادم للبوت
                let lastUpdate = data.result[data.result.length - 1];
                if (lastUpdate.message) {
                    CHAT_ID = lastUpdate.message.chat.id;
                    let title = lastUpdate.message.chat.title || "محادثة شخصية";
                    idDisplay.innerHTML = `✅ تم العثور على الجروب: <b>${title}</b> <br> الـ ID هو: <code style="color:#fff">${CHAT_ID}</code>`;
                    statusDiv.innerText = "تم الحفظ مؤقتاً! يمكنك الإرسال الآن.";
                    statusDiv.style.color = "#00ffcc";
                    return;
                }
            }
            statusDiv.innerText = "❌ لم يتم العثور على بيانات. أرسل أي رسالة داخل الجروب أولاً ثم جرب مجدداً.";
            statusDiv.style.color = "#ff3333";
        } catch (error) {
            statusDiv.innerText = "خطأ في الاتصال بتليجرام.";
        }
    }

    // دالة إرسال البيانات (نصوص أو ملفات)
    async function sendToVault() {
        const text = document.getElementById('textInput').value;
        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');

        if (!CHAT_ID) {
            statusDiv.innerText = "❌ الرجاء جلب الـ Chat ID أولاً بالضغط على الزر الأصفر!";
            statusDiv.style.color = "#ff3333";
            return;
        }

        statusDiv.style.color = "#ffcc00";
        statusDiv.innerText = "جاري الرفع والإرسال...";

        // 1. إذا كان هناك ملف مرفق
        if (fileInput.files.length > 0) {
            let file = fileInput.files[0];
            let formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("document", file);
            if(text) { formData.append("caption", text); } // إضافة النص كوصف للملف إذا وُجد

            try {
                let response = await fetch(`https://api.telegram.org/bot${TOKEN}/sendDocument`, {
                    method: "POST",
                    body: formData
                });
                let result = await response.json();
                if(result.ok) {
                    statusDiv.innerText = "✅ تم رفع الملف وإرساله للخزنة بنجاح!";
                    statusDiv.style.color = "#00ffcc";
                    document.getElementById('textInput').value = "";
                    fileInput.value = "";
                } else {
                    statusDiv.innerText = "❌ فشل الإرسال: " + result.description;
                }
            } catch (e) {
                statusDiv.innerText = "خطأ أثناء رفع الملف.";
            }
        } 
        // 2. إذا كان النص فقط هو الموجود
        else if (text.trim() !== "") {
            try {
                let response = await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: text })
                });
                let result = await response.json();
                if(result.ok) {
                    statusDiv.innerText = "✅ تم إرسال النص إلى الخزنة!";
                    statusDiv.style.color = "#00ffcc";
                    document.getElementById('textInput').value = "";
                } else {
                    statusDiv.innerText = "❌ فشل إرسال النص.";
                }
            } catch (e) {
                statusDiv.innerText = "خطأ أثناء إرسال النص.";
            }
        } else {
            statusDiv.innerText = "⚠️ من فضلك اكتب نصاً أو اختر ملفاً أولاً.";
            statusDiv.style.color = "#ffcc00";
        }
    }
</script>

</body>
</html>
