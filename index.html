<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONE Cash - دفع مشتريات وخدمات</title>
  
  <!-- استدعاء خط Tajawal من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    /* المتغيرات البصرية (Tokens) */
    :root {
      --primary-orange: #FF6B00;
      --primary-blue: #1C355E;
      --disabled-blue: #8C99B2;
      --bg-light: #F8F9FB;
      --border-gray: #E5E7EB;
      --text-muted: #9CA3AF;
      --radius-xl: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-light);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      color: var(--primary-blue);
    }

    /* الحاوية الرئيسية للتطبيق */
    .app-container {
      width: 100%;
      max-width: 430px;
      background-color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    /* الشريط العلوي (Header) */
    .header {
      background-color: var(--primary-orange);
      color: #FFFFFF;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid white;
      background-color: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .help-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    /* محتوى النموذج */
    .form-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-blue);
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
    }

    .custom-input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 2px solid var(--border-gray);
      border-radius: var(--radius-xl);
      font-size: 16px;
      font-weight: 600;
      color: var(--primary-blue);
      outline: none;
      transition: all 0.2s ease;
      background-color: #FFFFFF;
    }

    /* تركيز الحقل وحالات الإدخال */
    .custom-input:focus {
      border-color: var(--primary-orange);
    }

    .custom-input.filled {
      border-color: var(--primary-blue);
    }

    /* حقل رقم نقطة الدفع */
    .point-input {
      padding-right: 40px;
      text-align: left;
      direction: ltr;
    }

    .user-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #6B7280;
      font-size: 18px;
    }

    .qr-btn {
      width: 48px;
      height: 48px;
      border: 2px solid var(--border-gray);
      border-radius: var(--radius-xl);
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .favorite-link {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--primary-orange);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 2px;
    }

    /* قائمة العملة */
    .currency-select {
      width: 85px;
      height: 48px;
      border: 2px solid var(--border-gray);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
      background: white;
      font-weight: 700;
      font-size: 14px;
      color: var(--primary-blue);
    }

    .amount-words {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-blue);
      margin-top: 2px;
    }

    .balance-info {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-blue);
      margin-top: 4px;
    }

    /* حقل الملاحظة */
    .textarea-wrapper {
      position: relative;
    }

    .custom-textarea {
      width: 100%;
      height: 90px;
      padding: 12px;
      border: 2px solid var(--border-gray);
      border-radius: var(--radius-xl);
      font-size: 14px;
      color: var(--primary-blue);
      outline: none;
      resize: none;
      transition: all 0.2s ease;
    }

    .custom-textarea:focus {
      border-color: var(--primary-orange);
    }

    .char-counter {
      position: absolute;
      bottom: 10px;
      left: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* زر التالي */
    .submit-btn {
      width: 100%;
      height: 48px;
      background-color: var(--disabled-blue);
      color: white;
      border: none;
      border-radius: var(--radius-xl);
      font-size: 16px;
      font-weight: 700;
      cursor: not-allowed;
      margin-top: 20px;
      transition: all 0.2s ease;
    }

    .submit-btn.active {
      background-color: var(--primary-blue);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-right">
        <button class="back-btn">&#10140;</button>
        <h1 class="header-title">دفع مشتريات وخدمات</h1>
      </div>
      <div class="header-left">
        <div class="user-avatar">&#128100;</div>
        <div class="help-btn">?</div>
      </div>
    </header>

    <!-- Main Form -->
    <main class="form-body">
      
      <!-- 1. رقم نقطة الدفع -->
      <div class="field-group">
        <label class="field-label">أدخل رقم نقطة الدفع</label>
        <div class="input-row">
          <div class="input-wrapper">
            <input 
              type="text" 
              id="pointNumber" 
              class="custom-input point-input filled" 
              value="826268" 
            />
            <span class="user-icon">&#128100;</span>
          </div>
          <button class="qr-btn" type="button">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF6B00" stroke-width="2">
              <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
              <rect x="7" y="7" width="10" height="10" rx="1"/>
            </svg>
          </button>
        </div>
        <div class="favorite-link">
          <span>&#9733;</span>
          <span>اختر من المفضلة</span>
        </div>
      </div>

      <!-- 2. مبلغ العملية -->
      <div class="field-group">
        <label class="field-label">مبلغ العملية</label>
        <div class="input-row">
          <div class="input-wrapper">
            <input 
              type="text" 
              id="amountInput" 
              class="custom-input" 
              placeholder="أدخل المبلغ"
              value="1,000"
            />
          </div>
          <div class="currency-select">
            <span style="font-size: 10px; color: #6B7280;">&#9660;</span>
            <span>ر.ي</span>
          </div>
        </div>

        <!-- التفقيط (المبلغ بالكلمات) -->
        <div id="amountInWords" class="amount-words">ألف ر.ي</div>

        <!-- الرصيد -->
        <div class="balance-info">
          <span style="color: var(--primary-orange);">&#128683;</span>
          <span>رصيدي ****** ر.ي</span>
        </div>
      </div>

      <!-- 3. ملاحظة (اختياري) -->
      <div class="field-group">
        <label class="field-label">ملاحظة (اختياري)</label>
        <div class="textarea-wrapper">
          <textarea 
            id="noteInput" 
            class="custom-textarea" 
            maxlength="30" 
            placeholder="أضف ملاحظة هنا..."
          ></textarea>
          <span id="charCount" class="char-counter">0/30</span>
        </div>
      </div>

      <!-- 4. زر التالي -->
      <button id="submitBtn" class="submit-btn active">التالي</button>

    </main>
  </div>

  <script>
    const pointNumber = document.getElementById('pointNumber');
    const amountInput = document.getElementById('amountInput');
    const amountInWords = document.getElementById('amountInWords');
    const noteInput = document.getElementById('noteInput');
    const charCount = document.getElementById('charCount');
    const submitBtn = document.getElementById('submitBtn');

    // دالة تحويل الرقم لنص عربي
    function getArabicWords(num) {
      if (!num || isNaN(num)) return '';
      const n = parseInt(num);
      if (n === 1000) return 'ألف ر.ي';
      if (n === 2000) return 'ألفان ر.ي';
      if (n >= 3000 && n <= 10000) return n + ' آلاف ر.ي';
      return n.toLocaleString('en-US') + ' ر.ي';
    }

    // تنسيق إدخال المبلغ
    amountInput.addEventListener('input', (e) => {
      let rawValue = e.target.value.replace(/,/g, '');
      if (!isNaN(rawValue) && rawValue !== '') {
        e.target.value = Number(rawValue).toLocaleString('en-US');
        amountInWords.textContent = getArabicWords(rawValue);
      } else {
        e.target.value = '';
        amountInWords.textContent = '';
      }
      validateForm();
    });

    // عداد أحرف الملاحظة
    noteInput.addEventListener('input', (e) => {
      charCount.textContent = `${e.target.value.length}/30`;
    });

    // متابعة رقم نقطة الدفع
    pointNumber.addEventListener('input', () => {
      if (pointNumber.value.trim() !== '') {
        pointNumber.classList.add('filled');
      } else {
        pointNumber.classList.remove('filled');
      }
      validateForm();
    });

    // التحقق من صحة النموذج لتفعيل الزر
    function validateForm() {
      const hasPoint = pointNumber.value.trim().length >= 4;
      const hasAmount = amountInput.value.trim() !== '';

      if (hasPoint && hasAmount) {
        submitBtn.classList.add('active');
        submitBtn.disabled = false;
      } else {
        submitBtn.classList.remove('active');
        submitBtn.disabled = true;
      }
    }
  </script>
</body>
</html>
